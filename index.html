<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
  <link rel="apple-touch-icon" href="/favicon.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <title>Petricor | Botanical Extracts</title>
</head>

<body>
  <div id="root"></div>
  <script>
    // Track zoom-out steps. Each step of Ctrl+- is ~10% zoom reduction.
    // MAX_ZOOM_OUT = 1 means the user can zoom out to ~90% but no further.
    var zoomOutSteps = 0;
    var MAX_ZOOM_OUT = 1;

    // Ctrl+scroll (trackpad pinch or mouse wheel zoom)
    document.addEventListener('wheel', function(e) {
      if (!e.ctrlKey) return;
      if (e.deltaY > 0) {
        // Zooming OUT (scroll down with Ctrl)
        if (zoomOutSteps >= MAX_ZOOM_OUT) {
          e.preventDefault(); // block — already at 90%
        } else {
          zoomOutSteps++;
          // allow the browser to zoom out
        }
      } else {
        // Zooming IN (scroll up with Ctrl) — always allow
        if (zoomOutSteps > 0) zoomOutSteps--;
      }
    }, { passive: false });

    // Keyboard zoom shortcuts
    document.addEventListener('keydown', function(e) {
      if (!e.ctrlKey) return;
      if (e.key === '-' || e.key === '_') {
        // Zoom out
        if (zoomOutSteps >= MAX_ZOOM_OUT) {
          e.preventDefault(); // block — already at 90%
        } else {
          zoomOutSteps++;
        }
      } else if (e.key === '+' || e.key === '=') {
        // Zoom in — always allow
        if (zoomOutSteps > 0) zoomOutSteps--;
      } else if (e.key === '0') {
        // Reset to 100% — allow and reset counter
        zoomOutSteps = 0;
      }
    });
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
